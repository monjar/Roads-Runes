excluded:
  - Packages/*/.build
  - "*.xcodeproj"
  - DerivedData
disabled_rules:
  - trailing_comma
  - todo
  - identifier_name
  - type_body_length
  - file_length
  - function_body_length
  - function_parameter_count
  - cyclomatic_complexity
  - nesting
  - large_tuple
  - multiple_closures_with_trailing_closure
opt_in_rules:
  - empty_count
  - closure_spacing
line_length:
  warning: 200
  error: 260
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true
type_name:
  max_length: 50
