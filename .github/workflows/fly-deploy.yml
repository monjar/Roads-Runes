name: fly deploy

# master is what the phone talks to: test first, then ship to https://roadsandrunes.fly.dev.
on:
  push:
    branches: [master]
    paths: ["backend/**", ".github/workflows/fly-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -m "not integration" -q
        env:
          ENVIRONMENT: test
          DEV_AUTH_ENABLED: "true"
          JWT_SECRET: ci

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # The release command in backend/fly.toml runs `alembic upgrade head` before
      # the new machine takes traffic.
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
