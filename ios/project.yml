name: RoadsAndRunes
options:
  bundleIdPrefix: com.roadsandrunes
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # The Swift *language mode*, which has only ever been 4.0, 4.2, 5.0 or 6.0 —
    # "5.9" was a compiler version standing in for one, tolerated by Xcode 16 and
    # rejected outright by some toolchains. Release builds now run on a much newer
    # Xcode than local ones, so say the thing that is actually meant.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "7WBQP62F6Z"   # paid Individual team; Xcode registers the App IDs and capabilities
    CODE_SIGN_STYLE: Automatic
    # One version and one build number for the app and its watch app, both
    # overridable per upload: TestFlight refuses a build number it has seen
    # before, and the two targets have to agree or validation rejects the pair.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      API_BASE_URL: "http://localhost:8000"
      APPLE_SIGN_IN_ENABLED: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      API_BASE_URL: "https://roadsandrunes.fly.dev"
      APPLE_SIGN_IN_ENABLED: YES

packages:
  RoadsAndRunesCore:
    path: Packages/RoadsAndRunesCore
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.5.0"
  H3:
    path: Packages/H3

targets:
  RoadsAndRunes:
    type: application
    platform: iOS
    sources:
      - path: RoadsAndRunes
        excludes: ["Resources/Info.plist", "Resources/Fonts/*.txt"]
    dependencies:
      - package: RoadsAndRunesCore
      - package: MapLibre
        product: MapLibre
      - package: H3
        product: H3
      - target: RoadsAndRunesWatch
    info:
      path: RoadsAndRunes/Resources/Info.plist
      properties:
        CFBundleDisplayName: Roads & Runes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # actool writes the nested CFBundleIcons dict and leaves the top-level key to
        # the Info.plist; App Store validation reads the top-level one.
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIAppFonts: [Caprasimo-Regular.ttf, Figtree-Regular.ttf, Figtree-SemiBold.ttf, Figtree-Bold.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The app talks HTTPS and nothing else, which is exempt: saying so here saves
        # answering the export-compliance question by hand on every TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        API_BASE_URL: $(API_BASE_URL)
        # NO for builds signed by a free Personal Team, which cannot carry the entitlement.
        APPLE_SIGN_IN_ENABLED: $(APPLE_SIGN_IN_ENABLED)
        # A physical device reaches the dev backend by LAN address over plain HTTP
        # (API_BASE_URL=http://<mac-ip>:8000); this allows only local-network hosts.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connects to the Roads & Runes development server on your network.
        MAP_STYLE_MINIMAL: https://tiles.openfreemap.org/styles/positron
        MAP_STYLE_CYCLING: https://tiles.openfreemap.org/styles/positron
        MAP_STYLE_ADVENTURE: https://tiles.openfreemap.org/styles/bright
        MAP_STYLE_DETAILED: https://tiles.openfreemap.org/styles/liberty
        NSLocationWhenInUseUsageDescription: Roads & Runes shows your position on the world map and the quests around you.
        NSLocationAlwaysAndWhenInUseUsageDescription: During a ride, Roads & Runes records your route in the background so the map clears and objectives complete even when your phone is locked.
        NSLocationAlwaysUsageDescription: During a ride, Roads & Runes records your route in the background so the map clears and objectives complete even when your phone is locked.
        NSHealthShareUsageDescription: Read heart rate during your rides, runs and walks to show it on your Watch and in your journal.
        NSHealthUpdateUsageDescription: Save your rides, runs and walks as workouts in Health.
        NSMotionUsageDescription: Motion data improves distance accuracy when GPS is weak.
        NSCameraUsageDescription: Photograph discoveries for your journal.
        NSPhotoLibraryUsageDescription: Attach photos to discoveries and adventures.
        # Location only: the ride records while the phone is locked. Nothing here
        # uses BGTaskScheduler, and declaring `processing` without task identifiers
        # is both a validation failure and a capability the app never exercises.
        UIBackgroundModes: [location]
        LSApplicationQueriesSchemes: [strava]
        CFBundleURLTypes:
          - CFBundleURLName: com.roadsandrunes.app
            CFBundleURLSchemes: [roadsandrunes]
    entitlements:
      path: RoadsAndRunes/Resources/RoadsAndRunes.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.healthkit: true
        com.apple.security.application-groups: [group.com.roadsandrunes.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadsandrunes.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  RoadsAndRunesWatch:
    type: application
    platform: watchOS
    sources:
      - path: RoadsAndRunesWatch
        excludes: ["Resources/Info.plist"]
    dependencies:
      - package: RoadsAndRunesCore
    info:
      path: RoadsAndRunesWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Roads & Runes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        WKCompanionAppBundleIdentifier: com.roadsandrunes.app
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: false
        NSHealthShareUsageDescription: Read heart rate during rides, runs and walks.
        NSHealthUpdateUsageDescription: Save rides, runs and walks as workouts.
        NSLocationWhenInUseUsageDescription: Show your position on the ride map.
        WKBackgroundModes: [workout-processing]
    entitlements:
      path: RoadsAndRunesWatch/Resources/RoadsAndRunesWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups: [group.com.roadsandrunes.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadsandrunes.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  RoadsAndRunesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RoadsAndRunesTests]
    dependencies:
      - target: RoadsAndRunes
      - package: RoadsAndRunesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadsandrunes.app.tests
        GENERATE_INFOPLIST_FILE: YES  # test bundles have no Info.plist of their own

  RoadsAndRunesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RoadsAndRunesUITests]
    dependencies:
      - target: RoadsAndRunes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadsandrunes.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RoadsAndRunes

  RoadsAndRunesWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [RoadsAndRunesWatchTests]
    dependencies:
      - target: RoadsAndRunesWatch
      - package: RoadsAndRunesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadsandrunes.app.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES  # test bundles have no Info.plist of their own

schemes:
  RoadsAndRunes:
    build:
      targets:
        RoadsAndRunes: all
        RoadsAndRunesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [RoadsAndRunesTests]
  RoadsAndRunesWatch:
    build:
      targets:
        RoadsAndRunesWatch: all
        RoadsAndRunesWatchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [RoadsAndRunesWatchTests]
  # Drives the main flows against the local API (make api, make ios-ui-test); CI does not run it.
  RoadsAndRunesUITests:
    build:
      targets:
        RoadsAndRunes: all
        RoadsAndRunesUITests: [test]
    test:
      config: Debug
      targets: [RoadsAndRunesUITests]
