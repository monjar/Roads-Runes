[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roads-and-runes-backend"
version = "0.1.0"
description = "Roads & Runes backend: FastAPI modular monolith"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "redis>=5.0",
    "h3>=4.0",
    "structlog>=24.1",
    "orjson>=3.10",
    "python-multipart>=0.0.9",
    # Optional at runtime (LLM_PROVIDER=none skips it), but shipped so the
    # planner can be switched to Claude without rebuilding the image.
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires PostGIS/Redis (set DATABASE_URL)",
    "llm: calls the real model (set ANTHROPIC_API_KEY); costs money",
]
filterwarnings = ["ignore::DeprecationWarning"]
