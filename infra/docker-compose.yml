name: roadsandrunes

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: roadsandrunes
      POSTGRES_USER: rr
      POSTGRES_PASSWORD: rr
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rr -d roadsandrunes"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  graphhopper:
    # Needs routing/data/region.osm.pbf (see scripts/download-osm.sh). Started
    # only with `--profile routing` so the core stack works without an extract.
    image: israelhikingmap/graphhopper:latest
    profiles: ["routing"]
    command: ["--config", "/config.yml", "--input", "/data/region.osm.pbf"]
    environment:
      JAVA_OPTS: "-Xmx4g -Xms1g"
    volumes:
      - ../routing/config.yml:/config.yml:ro
      - ../routing/custom_models:/custom_models:ro
      - ../routing/data:/data
    ports:
      - "8989:8989"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8989/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40

  api:
    build: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://rr:rr@db:5432/roadsandrunes
      REDIS_URL: redis://redis:6379/0
      GRAPHHOPPER_URL: http://graphhopper:8989
      JOB_QUEUE: redis
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://rr:rr@db:5432/roadsandrunes
      REDIS_URL: redis://redis:6379/0
      GRAPHHOPPER_URL: http://graphhopper:8989
      JOB_QUEUE: redis
    command: python -m app.jobs.worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db-data:
