# The same Xcode the release builds with (see testflight.yml). A green build here
# used to prove nothing about the archive: the RuneMatcher type-check timeout that
# broke `app-build` only appeared on one toolchain's watchOS slice, and App Store
# Connect now requires the iOS 26 SDK, so the release runs on an Xcode this
# workflow never exercised. Same image, same selection step, no gap.
name: ios

on:
  push:
    branches: [master, main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  core-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the Xcode the release uses
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Build and test RoadsAndRunesCore
        working-directory: ios/Packages/RoadsAndRunesCore
        run: |
          swift build
          swift test

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: swiftlint --config ios/.swiftlint.yml ios

  app-build:
    # Unsigned simulator build of the iPhone app and its embedded Watch app.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the Xcode the release uses
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - run: >
          xcodebuild -project RoadsAndRunes.xcodeproj -scheme RoadsAndRunes
          -destination 'generic/platform=iOS Simulator' build
          CODE_SIGNING_ALLOWED=NO -quiet
        working-directory: ios
